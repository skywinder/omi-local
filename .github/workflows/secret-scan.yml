name: Local checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  transport-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==8.4.1 fastapi==0.121.0 httpx==0.28.0 python-dotenv==1.2.2 google-cloud-storage==2.18.0 PyYAML==6.0.1 websockets==12.0 prometheus-client==0.21.1
      - run: make test-transport-unit PYTHON="$(command -v python)"
  transport-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: make test-transport-app
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.24.2
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_8.24.2_checksums.txt" -o checksums.txt
          awk -v name="$archive" '$2 == name { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf "$archive" gitleaks
      - name: Scan files and history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --max-decode-depth 2
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --ignore-gitleaks-allow --max-decode-depth 2
