title = "Omi Local: reviewed synthetic fixtures"

[extend]
useDefault = true

# Exact values AND exact paths: a different value in the same file is still scanned.
# These exceptions cover emulator placeholders, test-only keys, checksums and request IDs.

[[rules]]
id = "gcp-api-key"

[[rules.allowlists]]
description = "Nonfunctional demo-omi-local emulator API key"
condition = "AND"
regexTarget = "secret"
regexes = ['''^AIzaSyDEMOOMILOCALFAKEKEY00000000000000$''']
paths = [
  '''(?:^|/)app/lib/firebase_options_local\.dart$''',
  '''(?:^|/)app/setup/prebuilt/firebase_options\.dart$''',
  '''(?:^|/)app/setup/prebuilt/google-services-local\.json$''',
  '''(?:^|/)app/setup/prebuilt/google-services\.json$''',
]

